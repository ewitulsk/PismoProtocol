[package]
name = "chart_publisher"
version = "0.1.0"
edition = "2021"

[lib]
name = "chart_publisher"
path = "src/lib.rs"

[[bin]]
name = "chart_publisher"
path = "src/main.rs"

[[example]]
name = "pyth_example"
path = "examples/pyth_example.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# WebSocket client
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
