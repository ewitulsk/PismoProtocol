[package]
name = "orderbook"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = "1.33"
thiserror = "1.0"
dashmap = "5.5"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
rust_decimal_macros = "1.33"