[workspace]
resolver = "2"
members = [
    "services/indexer",
    "services/shared",
]

[workspace.dependencies]
# Sui Indexer Framework
sui-data-ingestion-core = { git = "https://github.com/mystenlabs/sui", package = "sui-data-ingestion-core" }
sui-types = { git = "https://github.com/mystenlabs/sui", package = "sui-types" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Cryptography Provider for Rustls
rustls = { version = "0.23", features = ["ring"] }

# Database (Diesel + Postgres + Connection Pool)
diesel = { version = "2.2", features = ["postgres", "uuid", "r2d2", "chrono", "numeric"] }
diesel_migrations = { version = "2", features = ["postgres"] }
r2d2 = "0.8"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bcs = "0.1"
hex = "0.4"

# Utilities & Error Handling
anyhow = "1.0"
dotenvy = "0.15"
lazy_static = "1.5"
config = { version = "0.14", features = ["toml"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Middleware
tower-http = { version = "0.5.2", features = ["cors"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }

# Async database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "bigdecimal"] }